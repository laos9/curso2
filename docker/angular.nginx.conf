# Si la visita llego por HTTPS a un proxy de delante, se respeta ese aviso;
# si no hay proxy, vale el esquema con el que llego aqui.
map $http_x_forwarded_proto $esquema_real {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El directorio de nombres de la red de Docker. Con el, nginx busca a
    # laravel y a django en cada peticion y no solo al arrancar: si uno se
    # recrea con otra IP lo sigue encontrando, y si no existe, nginx arranca
    # igual y solo esa ruta responde 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # La API de Laravel, por el mismo origen: nada de CORS.
    location /api/ {
        set $laravel http://laravel:80;
        proxy_pass $laravel;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $esquema_real;
    }

    # La API de Django, en su propia ruta.
    location /django/ {
        set $django http://django:8000;
        rewrite ^/django/(.*)$ /api/$1 break;
        proxy_pass $django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $esquema_real;
    }

    # Angular maneja sus propias rutas: todo lo demas cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
